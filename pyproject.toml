[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aiedit"
version = "1.0.0"
description = "ML-based genome assembly polisher"
authors = [{ name = "Parham Kazemi", email = "pkazemi@bcgsc.ca" }]
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
aiedit = "aiedit.__main__:main"
